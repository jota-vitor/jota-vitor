<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="jota. João Vitor, desenvolvedor back-end">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <radialGradient id="brilho" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e10600" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#e10600" stop-opacity="0"/>
    </radialGradient>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="320" fill="#000000"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <circle cx="1010" cy="40" r="380" fill="url(#brilho)"/>
  <rect x="0" y="312" width="1200" height="8" fill="#e10600"/>

  <g class="sans">
    <rect x="72" y="44" width="232" height="30" rx="15" fill="#e10600" fill-opacity="0.14" stroke="#e10600" stroke-opacity="0.55"/>
    <circle cx="92" cy="59" r="5" fill="#e10600">
      <animate attributeName="fill-opacity" values="1;0.35;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="106" y="64" font-size="14" fill="#ffffff">aberto a estágio e júnior</text>
  </g>

  <text x="66" y="172" class="sans" font-size="112" font-weight="800" fill="#ffffff" letter-spacing="-5">jota<tspan fill="#e10600">.</tspan></text>
  <text x="72" y="236" class="sans" font-size="24" fill="#d4d4d4">João Vitor, desenvolvedor back-end em Python</text>
  <text x="72" y="272" class="mono" font-size="16" fill="#737373">fastapi  postgresql  redis  docker  pytest</text>

  <g transform="translate(860 64)" class="mono" font-size="13">
    <rect width="276" height="196" rx="12" fill="#0d0d0d" stroke="#2a2a2a"/>
    <rect width="276" height="36" rx="12" fill="#141414"/>
    <rect y="24" width="276" height="12" fill="#141414"/>
    <circle cx="20" cy="18" r="5" fill="#e10600"/>
    <circle cx="38" cy="18" r="5" fill="#3a3a3a"/>
    <circle cx="56" cy="18" r="5" fill="#3a3a3a"/>
    <text x="80" y="22" fill="#6b6b6b">~/ledger-api</text>
    <text x="20" y="66" fill="#6b6b6b">$ <tspan fill="#ffffff">pytest -q</tspan></text>
    <text x="20" y="90" fill="#ffffff">.................... </text>
    <text x="20" y="112" fill="#ffffff">21 passed</text>
    <text x="20" y="146" fill="#6b6b6b">POST /transfers</text>
    <text x="20" y="170" fill="#e10600">422 <tspan fill="#a3a3a3">insufficient_funds</tspan></text>
  </g>
</svg>
